<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Widget IntiCo</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <!-- Fondo: sitio web de IntiCo 
  <iframe src="https://intico.ai/" title="IntiCo"></iframe> -->

  <!-- ÍCONO flotante -->
  <div id="chat-icon" title="Chatear con IntiCo">
  </div>

  <!-- WIDGET flotante (oculto por defecto) -->
  <div id="intico-widget" class="widget hidden">
    <header class="widget-header">
      <a href="https://intico.ai/" target="_blank" rel="noopener noreferrer">IntiCo</a>
      <button id="close-widget" title="Cerrar">✕</button>
    </header>

    <main class="widget-body">
      <div id="messages" class="messages"></div>

      <form id="chat-form" class="chat-form">
        <input id="text-input" type="text" placeholder="Escribe un mensaje..." autocomplete="off"/>
        <button id="send-text" type="button">Enviar</button>

        <div class="recorder-controls">
          <button id="record-btn" type="button">Audio</button>
          <span id="record-status"></span>
        </div>
      </form>
    </main>

    <footer class="widget-footer">
      <small>Enviado a tu flujo n8n • Soporta texto y audio</small>
    </footer>
  </div>

  <script src="widget.js"></script>
</body>
</html>
